default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch('DATABASE_PATH', 'db/development.sqlite3') %>

test:
  <<: *default
  database: <%= ENV.fetch('DATABASE_PATH', 'db/test.sqlite3') %>

production:
  <<: *default
  database: <%= ENV.fetch('DATABASE_PATH', 'db/production.sqlite3') %>
