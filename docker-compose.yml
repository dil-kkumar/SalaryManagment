services:
  # ── Rails API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: salary-management-backend:latest
    ports:
      - "3001:3001"
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_LOG_LEVEL: info
      # Change this to a random secret before deploying publicly
      SECRET_KEY_BASE: "changeme_use_a_real_secret_in_production_min_32_chars"
      CORS_ORIGINS: "http://localhost:3000"
      DATABASE_PATH: "/data/development.sqlite3"
    volumes:
      # Mount source code for live development
      - ./backend:/app
      # Persist SQLite DB across container restarts
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ── Backend Test Runner (RSpec) ────────────────────────────────────────────
  backend-test:
    image: salary-management-backend:latest
    environment:
      RAILS_ENV: test
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_LOG_LEVEL: info
      SECRET_KEY_BASE: "test_secret_key_min_32_characters_1234567890"
      DATABASE_PATH: "/data/test.sqlite3"
    volumes:
      # Mount source code for development/testing
      - ./backend:/app
      # Persist test database separately from mounted code
      - sqlite_test:/data
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cd /app
        bundle config unset without
        bundle install
        bundle exec rake db:create db:migrate
        echo "==> Checking for spec files..."
        find spec -name '*_spec.rb' -type f
        echo "==> Running RSpec tests..."
        bundle exec rspec spec --format documentation
    profiles: ["test"]

  # ── Next.js UI ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL that the *browser* uses to reach the backend.
        # When running locally, both services are reachable via localhost.
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for live development
      - ./frontend:/app
      # Don't mount node_modules so we use the version installed in the image
      - /app/node_modules
      # Also mount .next so it's not lost
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
  sqlite_test:
